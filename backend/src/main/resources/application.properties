# ===============================
# APPLICATION
# ===============================
spring.application.name=SistemaFitness
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/adaptfit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=adaptfit
spring.datasource.password=adaptfit

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.type.preferred_enum_type=STRING

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# WORKOUT ENGINE CONFIG
# ===============================
workout.progression.load-increase=0.025
workout.progression.load-decrease=0.05
workout.progression.stagnation-weeks=3
workout.deload.volume-reduction=0.35
workout.reps.min=8
workout.reps.max=12

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:chave-super-secreta-para-jwt-token-generation-mais-longa}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# RAG CONFIG
# ===============================
rag.qdrant.enabled=${RAG_QDRANT_ENABLED:true}
rag.qdrant.url=http://localhost:6333

# ===============================
# LLM CONFIG
# ===============================
llm.base-url=${LLM_BASE_URL:http://localhost:11434}
llm.model=${LLM_MODEL:llama3.2:1b}
llm.temperature=${LLM_TEMPERATURE:0.7}
llm.timeout=${LLM_TIMEOUT:300000}
llm.max-tokens=${LLM_MAX_TOKENS:512}

